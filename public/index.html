<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sky Snapshot</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header id="dashboard-header">
    <h1>Sky Snapshot</h1>
    <time id="live-clock"></time>
  </header>

  <div id="chart-tooltip" class="chart-tooltip" hidden></div>

  <main>
    <p id="location-label">Loading demo sky for the default location&hellip;</p>

    <div id="location-controls">
      <button id="use-location-btn" type="button">Use my location</button>

      <div id="manual-location" hidden>
        <p id="manual-location-message" role="alert"></p>
        <form id="manual-location-form" novalidate>
          <label>
            Latitude
            <input id="manual-lat" type="number" step="any" min="-90" max="90" required />
          </label>
          <label>
            Longitude
            <input id="manual-lon" type="number" step="any" min="-180" max="180" required />
          </label>
          <button type="submit">Show sky snapshot</button>
          <p id="manual-location-error" role="alert"></p>
        </form>
      </div>
    </div>

    <section id="results" aria-live="polite">
      <p id="status">Loading&hellip;</p>
      <div id="lists" hidden>
        <p id="last-updated" class="last-updated"></p>

        <div id="stat-strip">
          <div class="stat-tile">
            <span class="stat-value" id="stat-stars">0</span>
            <span class="stat-label">Stars</span>
          </div>
          <div class="stat-tile">
            <span class="stat-value" id="stat-planets">0</span>
            <span class="stat-label">Planets</span>
          </div>
          <div class="stat-tile">
            <span class="stat-value" id="stat-galaxies">0</span>
            <span class="stat-label">Galaxies</span>
          </div>
          <div class="stat-tile">
            <span class="stat-value" id="stat-constellations">0</span>
            <span class="stat-label">Constellations</span>
          </div>
        </div>

        <div class="panel" id="chart-panel">
          <h2>Sky Chart</h2>
          <div id="sky-chart"></div>
        </div>

        <div class="panel" id="focus-panel">
          <h2>Focus</h2>
          <p id="focus-panel-content">Select an object to see details</p>
        </div>

        <div class="panel" id="constellations-panel">
          <h2>Constellations</h2>
          <ul id="constellations-list"></ul>
        </div>
      </div>
    </section>
  </main>

  <script src="/chart.js"></script>
  <script src="/stats.js"></script>
  <script src="/timeFormat.js"></script>
  <script src="/validate.js"></script>
  <script src="/app.js"></script>
</body>
</html>
