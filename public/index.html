<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sky Snapshot</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main>
    <h1>Sky Snapshot</h1>
    <p id="location-label">Loading demo sky for the default location&hellip;</p>

    <section id="results" aria-live="polite">
      <p id="status">Loading&hellip;</p>
      <div id="lists" hidden>
        <div>
          <h2>Constellations</h2>
          <ul id="constellations-list"></ul>
        </div>
        <div>
          <h2>Famous Stars</h2>
          <ul id="stars-list"></ul>
        </div>
        <div>
          <h2>Planets</h2>
          <ul id="planets-list"></ul>
        </div>
        <div>
          <h2>Galaxies</h2>
          <ul id="galaxies-list"></ul>
        </div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
