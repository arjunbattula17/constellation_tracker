<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sky Snapshot</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="sky-view" class="sky-view" data-mode="circular" aria-label="Interactive sky map"></div>

  <div id="chart-tooltip" class="chart-tooltip" hidden></div>

  <header id="app-header">
    <h1>Sky Snapshot</h1>
    <time id="live-clock"></time>
  </header>

  <div id="view-toggle" class="view-toggle" role="group" aria-label="Sky view style">
    <button type="button" data-mode="circular" class="active" aria-pressed="true">All-sky</button>
    <button type="button" data-mode="landscape" aria-pressed="false">Horizon</button>
  </div>

  <div id="location-panel">
    <p id="location-label">Loading the sky for the default location&hellip;</p>
    <div id="location-controls">
      <button id="use-location-btn" type="button">Use my location</button>
      <div id="manual-location" hidden>
        <p id="manual-location-message" role="alert"></p>
        <form id="manual-location-form" novalidate>
          <label>Latitude
            <input id="manual-lat" type="number" step="any" min="-90" max="90" required />
          </label>
          <label>Longitude
            <input id="manual-lon" type="number" step="any" min="-180" max="180" required />
          </label>
          <button type="submit">Show sky</button>
          <p id="manual-location-error" role="alert"></p>
        </form>
      </div>
    </div>
  </div>

  <div id="info-overlay" class="info-overlay" aria-live="polite">
    <p id="status" hidden>Loading&hellip;</p>
    <p id="info-content"></p>
  </div>

  <script src="/projection.js"></script>
  <script src="/chart.js"></script>
  <script src="/validate.js"></script>
  <script src="/skyview.js"></script>
  <script src="/app.js"></script>
</body>
</html>
